<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
{% extends "base.html" %}

{% block title %}Zaloguj się — BillWarden{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="card-box">
        <h2>🧾 Zaloguj się</h2>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Nazwa użytkownika</label>
                <input type="text" name="username" id="username" class="form-control"
                       placeholder="jan_kowalski" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Hasło</label>
                <input type="password" name="password" id="password" class="form-control" required>
            </div>
            <button type="submit" class="btn-primary">Zaloguj się</button>
        </form>
        <div class="auth-link">
            Nie masz konta? <a href="{% url 'register' %}">Zarejestruj się</a>
        </div>
    </div>
</div>
{% endblock %}
</body>
</html>
